services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - crm_pgdata:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d crm_system"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    build: ./backend
    environment:
      PORT: 4000
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/crm_system
      JWT_SECRET: change-this-in-production
      FRONTEND_URL: http://localhost:5175
    ports:
      - "4002:4000"
    depends_on:
      postgres:
        condition: service_healthy
  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://localhost:4002/api
    ports:
      - "5175:5173"
    depends_on:
      - backend
volumes:
  crm_pgdata:
