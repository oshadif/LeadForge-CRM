services:
  - type: web
    name: leadforge-crm
    runtime: node
    plan: free
    buildCommand: npm --prefix frontend install && npm --prefix frontend run build && npm --prefix backend install
    startCommand: npm --prefix backend start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: leadforge-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: leadforge-crm-db
    plan: free
    databaseName: leadforge_crm
    user: leadforge
